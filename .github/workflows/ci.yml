name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04 

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DB_NAME: cctv_alerts
      DB_USER: cctv_user
      DB_PASSWORD: testpass
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Build check
        run: python config/wsgi.py

      - name: Publish artifact
        uses: actions/upload-artifact@v5
        with:
          name: webapi
          path: .