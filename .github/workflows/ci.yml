name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and build check
        run: |
          pip install -r requirements.txt
          python config/wsgi.py

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - server: app-server-1
            service: gunicorn
          - server: app-server-2
            service: gunicorn
    runs-on: [self-hosted, "${{ matrix.server }}"]
    steps:
      - name: Deploy to ${{ matrix.server }}
        run: |
          set -e
          cd /home/appsadmin/application
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          sudo systemctl restart ${{ matrix.service }}
          sleep 3
          systemctl is-active --quiet ${{ matrix.service }}